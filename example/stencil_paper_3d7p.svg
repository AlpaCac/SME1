<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#27718a"/></marker></defs>
  <style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#20323b}.t{font-size:32px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px}.code{font-family:Menlo,monospace;font-size:16px}.panel{stroke:#52717c;stroke-width:2}.arr{fill:none;stroke:#27718a;stroke-width:3;marker-end:url(#arrow)}</style>
  <rect width="1400" height="800" fill="#fbfaf6"/><text x="50" y="55" class="t">3D 7P：按循环执行的 SME 外积计算</text><text x="50" y="88" class="b">邻域：中心加 x/y/z 三个轴向的正负邻居。每次 ZA tile 仍覆盖一个二维输出切片。</text>
  <rect x="40" y="120" width="370" height="620" rx="18" fill="#dff1f7" class="panel"/><text x="65" y="158" class="h">1. 三个平面的依赖</text>
  <g fill="#fff" stroke="#9db2bb"><rect x="95" y="205" width="145" height="145"/><rect x="135" y="245" width="145" height="145"/><rect x="175" y="285" width="145" height="145"/></g><rect x="135" y="245" width="145" height="145" fill="none" stroke="#d35d5d" stroke-width="4"/><text x="80" y="224" class="s">z-1</text><text x="280" y="410" class="s">z+1</text><text x="175" y="235" class="s">z 平面</text>
  <text x="75" y="475" class="b">物理输入流：</text><text x="75" y="507" class="s">A：dz=0, dx=0, dy=-1,0,+1</text><text x="75" y="536" class="s">B/C：dz=0, dx=-1/+1, dy=0</text><text x="75" y="565" class="s">D/E：dz=-1/+1, dx=0, dy=0</text><text x="75" y="614" class="s">A 填充多行 ZA；其余流只补充对应行。</text>
  <rect x="440" y="120" width="540" height="620" rx="18" fill="#f0eaf7" class="panel"/><text x="465" y="158" class="h">2. 循环如何组织</text>
  <rect x="475" y="190" width="470" height="77" rx="10" fill="#d9edf4"/><text x="498" y="222" class="code">for (k, i, j 的输出 tile) {</text><text x="525" y="250" class="code">svzero_za();</text>
  <rect x="500" y="287" width="420" height="92" rx="10" fill="#e4f0d9"/><text x="523" y="320" class="code">for (每个 dz/dx 输入流) {</text><text x="550" y="348" class="code">for (该流的 source_row) {</text>
  <rect x="525" y="398" width="370" height="119" rx="10" fill="#fff2cf"/><text x="547" y="431" class="code">values = load(k+dz, row, j+dx);</text><text x="547" y="460" class="code">coeff  = 由 dy 关系构造;</text><text x="547" y="489" class="code">svmopa(ZA, coeff, values);</text>
  <text x="550" y="548" class="code">}</text><text x="523" y="576" class="code">}</text><rect x="500" y="596" width="420" height="70" rx="10" fill="#d8eded"/><text x="523" y="628" class="code">逐 ZA 行读取并写回 (k, i+r, j..);</text>
  <rect x="1010" y="120" width="350" height="620" rx="18" fill="#eef7ed" class="panel"/><text x="1035" y="158" class="h">3. 一次 MOPA 的意义</text>
  <rect x="1040" y="205" width="135" height="75" rx="8" fill="#9fd4e7" class="panel"/><text x="1055" y="238" class="s">某 dz/dx 的</text><text x="1055" y="261" class="s">连续输入行</text><path d="M1175 242H1215" class="arr"/><rect x="1220" y="205" width="100" height="75" rx="8" fill="#ece1ad" class="panel"/><text x="1231" y="238" class="s">dy 移位</text><text x="1231" y="261" class="s">系数列</text><path d="M1270 280V330" class="arr"/>
  <rect x="1200" y="340" width="120" height="155" fill="#82c9cd" class="panel"/><path d="M1240 340V495M1280 340V495M1200 379H1320M1200 418H1320M1200 457H1320" stroke="#4e969d"/><text x="1235" y="530" class="h">ZA</text>
  <text x="1040" y="585" class="s">不同 dz 平面不会混淆：</text><text x="1040" y="614" class="s">它们以不同流进入同一个输出 tile。</text><text x="1040" y="665" class="s">每个输出点最终得到 7 项贡献。</text>
</svg>
