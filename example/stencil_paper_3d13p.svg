<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#27718a"/></marker></defs>
  <style>text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#20323b}.t{font-size:32px;font-weight:700}.h{font-size:21px;font-weight:700}.b{font-size:18px}.s{font-size:16px}.code{font-family:Menlo,monospace;font-size:16px}.panel{stroke:#52717c;stroke-width:2}.arr{fill:none;stroke:#27718a;stroke-width:3;marker-end:url(#arrow)}</style>
  <rect width="1400" height="800" fill="#fbfaf6"/><text x="50" y="55" class="t">3D 13P：当前源代码拓扑的论文式计算流程</text><text x="50" y="88" class="b">注意：这是 stencil_all_sme.cpp 的非对称 13 点算子，不是论文实验中的轴向 3DStarR2。</text>
  <rect x="40" y="120" width="440" height="620" rx="18" fill="#dff1f7" class="panel"/><text x="65" y="158" class="h">1. 先按 (dz, dx) 合并为 7 条物理流</text>
  <g class="s"><rect x="75" y="190" width="370" height="45" rx="7" fill="#a4d9e9" class="panel"/><text x="93" y="219">(0, 0)：dy=-1,0,+1，共 3 点</text><rect x="75" y="244" width="370" height="45" rx="7" fill="#c6e1b5" class="panel"/><text x="93" y="273">(0,-1)、(0,+1)：dy=0，共 2 点</text><rect x="75" y="298" width="370" height="45" rx="7" fill="#b8c7ea" class="panel"/><text x="93" y="327">(-1,0)、(+1,0)：dy=-1,0,+1，共 6 点</text><rect x="75" y="352" width="370" height="45" rx="7" fill="#e4c4db" class="panel"/><text x="93" y="381">(-1,-1)、(+1,+1)：dy=0，共 2 点</text></g>
  <text x="75" y="440" class="b">每条流的含义：</text><text x="75" y="472" class="s">固定 dz、dx 后，加载一条连续 x 向量；</text><text x="75" y="501" class="s">系数列决定它能贡献给哪些输出 y 行。</text><text x="75" y="550" class="b">点数核对：3 + 2 + 6 + 2 = 13</text><text x="75" y="593" class="s">所有系数均为 1/13，与原代码求平均一致。</text>
  <rect x="510" y="120" width="525" height="620" rx="18" fill="#f0eaf7" class="panel"/><text x="535" y="158" class="h">2. 对每个输出 tile 的循环</text>
  <rect x="545" y="190" width="455" height="77" rx="10" fill="#d9edf4"/><text x="568" y="222" class="code">for (k, i, j 的输出 tile) {</text><text x="595" y="250" class="code">svzero_za();</text>
  <rect x="570" y="287" width="405" height="92" rx="10" fill="#e4f0d9"/><text x="593" y="320" class="code">for (每个有效 dz/dx 流) {</text><text x="620" y="348" class="code">for (source_row 覆盖 y halo) {</text>
  <rect x="595" y="398" width="355" height="119" rx="10" fill="#fff2cf"/><text x="617" y="431" class="code">values = load(k+dz, row, j+dx);</text><text x="617" y="460" class="code">coeff = 匹配合法 dy 的移位列;</text><text x="617" y="489" class="code">svmopa(ZA, coeff, values);</text>
  <text x="620" y="548" class="code">}</text><text x="593" y="576" class="code">}</text><rect x="570" y="596" width="405" height="70" rx="10" fill="#d8eded"/><text x="593" y="628" class="code">for (有效 ZA 行) read slice + store;</text>
  <rect x="1065" y="120" width="295" height="620" rx="18" fill="#eef7ed" class="panel"/><text x="1090" y="158" class="h">3. 循环内的数据流</text>
  <rect x="1095" y="205" width="220" height="55" rx="8" fill="#9fd4e7" class="panel"/><text x="1120" y="238" class="b">连续 source row</text><path d="M1205 260V305" class="arr"/><rect x="1095" y="315" width="220" height="55" rx="8" fill="#ece1ad" class="panel"/><text x="1110" y="348" class="b">按 dy 生成系数列</text><path d="M1205 370V415" class="arr"/><rect x="1145" y="425" width="130" height="150" fill="#82c9cd" class="panel"/><path d="M1188 425V575M1232 425V575M1145 463H1275M1145 501H1275M1145 539H1275" stroke="#4e969d"/><text x="1178" y="610" class="h">ZA</text>
  <text x="1095" y="660" class="s">同一 source row 可复用，</text><text x="1095" y="689" class="s">但只累计到拓扑允许的行。</text>
</svg>
